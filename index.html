<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Grainfall</title>
<!-- web version only (the iPhone app ignores these): Home Screen icon, full screen, offline -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grainfall">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a160b">
<style>
@font-face { font-family: "Lilita One"; src: url(fonts/LilitaOne.woff2) format("woff2"); font-display: block; }
@font-face { font-family: "Nunito"; src: url(fonts/Nunito.woff2) format("woff2"); font-weight: 200 1000; font-display: swap; }
/* Layout: one-screen wooden cabinet — shelf HUD on top, tall board below, every screen is an overlay inside the board. Single warm-wood look. */
:root {
  --bg: #2a160b;
  --shelf: #d79a5c;
  --shelf-dark: #a8642f;
  --ink: #6e300f;
  --ink-soft: #8a4a22;
  --cream: #fbe3c0;
  --sand: #f5d6ad;
  --gold: #ffd24a;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", ui-rounded, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(8px, env(safe-area-inset-top, 0px));
  padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  margin: 0;
  box-sizing: border-box;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#cab { display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.55); }
#hud {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: linear-gradient(#e8b479, var(--shelf) 55%, var(--shelf-dark));
  border-bottom: 3px solid #5a2a10;
}
.num { font-family: var(--display); font-size: clamp(22px, 6vw, 34px); line-height: 1; color: var(--ink);
  text-shadow: 0 1px 0 rgba(255,235,200,.7), 0 -1px 0 rgba(80,30,5,.35); font-variant-numeric: tabular-nums; }
.num small { font-size: .62em; }
#score { text-align: right; }
.lbl { display: block; font-family: var(--body); font-weight: 800; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
#trays { display: flex; gap: 6px; }
.tray { background: linear-gradient(#7a4020, #9a5a2e); border-radius: 6px; padding: 2px 6px 4px; box-shadow: inset 0 2px 5px rgba(0,0,0,.5); border: 0; box-sizing: content-box; }
.tray .lbl { color: #f1c999; font-size: 8px; text-align: center; }
.tray canvas { display: block; }
#holdTray { cursor: pointer; touch-action: manipulation; }
#holdTray.used canvas { opacity: .35; }
#time.low { color: #b3200a; animation: pulse .6s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .55; } }
#wrap { position: relative; touch-action: none; }
#board { display: block; touch-action: none; }

/* screens */
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 12px;
  background: rgba(30,12,4,.62); text-align: center; padding: 16px; box-sizing: border-box;
  overflow-y: auto; touch-action: pan-y;
}
.overlay > :first-child { margin-top: auto; }
.overlay > :last-child { margin-bottom: auto; }
.overlay.sub { background: rgba(26,10,3,.86); }
.overlay h1, .overlay h2 { font-family: var(--display); font-weight: 400; margin: 0; color: var(--cream); text-wrap: balance;
  text-shadow: 0 3px 0 #6e300f, 0 6px 16px rgba(0,0,0,.6); }
.overlay h1 { line-height: 0; }
#logo { display: block; }
.overlay h2 { font-size: clamp(30px, 8vw, 42px); }
.overlay p { margin: 0; max-width: 30ch; font-weight: 600; line-height: 1.45; color: var(--sand); }
.overlay .big { font-family: var(--display); font-size: 40px; color: #ffd28a; font-variant-numeric: tabular-nums; }
button {
  font-family: var(--display); font-size: 22px; color: var(--ink); cursor: pointer;
  padding: 10px 28px; border: 0; border-radius: 10px; touch-action: manipulation;
  background: linear-gradient(#f6cf98, #dc9a58); box-shadow: 0 4px 0 #8a4a1c, 0 8px 14px rgba(0,0,0,.4);
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a4a1c; }
button:focus-visible { outline: 3px solid #ffe2a8; outline-offset: 3px; }
button:disabled { cursor: default; }
.modes { display: grid; gap: 8px; width: min(100%, 290px); }
.mode { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; padding: 8px 16px 9px; }
.mode b { font-weight: 400; font-size: 22px; line-height: 1.1; }
.mode span { font-family: var(--body); font-weight: 800; font-size: 12px; color: #7a3e18; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.small button, button.small { font-size: 15px; padding: 7px 14px; box-shadow: 0 3px 0 #8a4a1c; }
.link { background: none; box-shadow: none; color: #f1c999; font-size: 16px; text-decoration: underline; padding: 6px 10px; }
.link:active { box-shadow: none; }
.set input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 220px; height: 30px; margin: 4px auto 0; background: transparent; }
.set input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, #e3a062 var(--p, 0%), rgba(0,0,0,.4) var(--p, 0%)); box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
.set input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -9px; border-radius: 50%;
  background: linear-gradient(#f6c98f, #d9934f); box-shadow: 0 2px 0 #8a4a1c, 0 3px 6px rgba(0,0,0,.4); }
.seg { display: flex; gap: 6px; background: rgba(0,0,0,.35); padding: 5px; border-radius: 12px; }
.seg button { font-size: 16px; padding: 6px 12px; background: transparent; color: #f1c999; box-shadow: none; }
.seg button[aria-pressed="true"] { background: linear-gradient(#f6cf98, #dc9a58); color: var(--ink); box-shadow: 0 2px 0 #8a4a1c; }
#diffNote { font-size: 13px; color: #e8bf8f; min-height: 2.9em; }
#levelGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(100%, 320px); }
.lvl { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 4px 6px; font-size: 24px; min-width: 0; }
.lvl b { font-weight: 400; line-height: 1; }
.lvl small { font-family: var(--body); font-weight: 800; font-size: 11px; color: #7a3e18; white-space: nowrap; }
.lvl i { font-style: normal; font-family: var(--body); font-weight: 800; font-size: 13px; letter-spacing: 1px; color: rgba(110,48,15,.28); }
.lvl i .on { color: var(--ink); }
.lvl:disabled { opacity: .45; filter: saturate(.5); }
.chap { grid-column: 1 / -1; margin: 10px 0 0; font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--cream); text-align: left; }
.chap:first-child { margin-top: 0; }
.lvl.boss { grid-column: 1 / -1; } /* each chapter's tenth level is its finale */
#woodGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: min(100%, 320px); }
.wood { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 6px 8px; font-size: 18px; min-width: 0; }
.wood b { font-weight: 400; }
.wood canvas { display: block; border-radius: 4px; }
.wood small { font-family: var(--body); font-weight: 800; font-size: 11px; color: #7a3e18; line-height: 1.3; }
.wood[aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 2px; }
.wood.locked { opacity: .6; filter: saturate(.6); }
#overB { white-space: pre-line; }
.lvl em { font-style: normal; font-family: var(--body); font-weight: 800; font-size: 11px; color: #7a3e18; }
#hsList { width: min(100%, 290px); text-align: left; }
#hsList h3, .stathead { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--cream); margin: 14px 0 6px; }
#hsList h3:first-child { margin-top: 0; }
.stathead { width: min(100%, 290px); text-align: left; }
#hsList dl { display: grid; grid-template-columns: 1fr auto; gap: 5px 16px; margin: 0; }
#hsList dt { font-size: 14px; font-weight: 700; color: var(--sand); align-self: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#hsList dt.none { opacity: .6; font-weight: 600; }
#hsList dd { margin: 0; font-family: var(--display); color: #ffd28a; font-size: 18px; text-align: right; font-variant-numeric: tabular-nums; }
#statList { display: grid; grid-template-columns: 1fr auto; gap: 7px 16px; margin: 0; width: min(100%, 290px); text-align: left; }
#statList dt { font-size: 14px; font-weight: 700; color: var(--sand); align-self: center; }
#statList dd { margin: 0; font-family: var(--display); color: #ffd28a; font-size: 18px; text-align: right; font-variant-numeric: tabular-nums; }
.set { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--sand); font-weight: 800; }
#overStars { font-size: 44px; letter-spacing: 6px; color: rgba(255,210,138,.22); line-height: 1; }
#overStars .on { color: var(--gold); text-shadow: 0 0 14px rgba(255,200,80,.6); }
.overlay p.unlock { background: rgba(255,210,120,.16); border-radius: 10px; padding: 8px 12px; color: #ffe2a8; }
#tut {
  position: absolute; left: 10px; right: 10px; top: 10px; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 12px; background: rgba(30,12,4,.88); color: var(--cream);
  font-weight: 700; font-size: 15px; line-height: 1.35; box-shadow: 0 6px 16px rgba(0,0,0,.4); pointer-events: none;
}
#tutT { flex: 1; min-width: 0; }
#tutSkip { pointer-events: auto; font-size: 14px; padding: 5px 12px; box-shadow: 0 2px 0 #8a4a1c; }

#bar { margin-top: auto; display: flex; gap: 22px; align-items: center; flex-wrap: nowrap; justify-content: center; padding-top: 4px; }
#bar button { font-size: 18px; padding: 10px 20px; box-shadow: 0 3px 0 #8a4a1c; }
#bar #dropBtn { font-size: 27px; padding: 13px 40px; box-shadow: 0 4px 0 #8a4a1c, 0 6px 12px rgba(0,0,0,.45); }
#bar #dropBtn:active { box-shadow: 0 1px 0 #8a4a1c; }
#bar #holdBtn { font-size: 21px; padding: 11px 26px; }
#bar.idle .ingame { visibility: hidden; }
</style>
</head>
<body>
<div id="app">
  <div id="cab">
    <div id="hud">
      <div class="num" id="time"><span class="lbl" id="timeL">Time</span><span id="timeV">180</span><small id="timeU"> s</small></div>
      <div id="trays">
        <button class="tray" id="holdTray" type="button" aria-label="Hold piece"><span class="lbl">Hold</span><canvas id="hold"></canvas></button>
        <div class="tray"><span class="lbl">Next</span><canvas id="next"></canvas></div>
      </div>
      <div class="num" id="score"><span class="lbl" id="scoreL">Score</span><span id="scoreV">0</span></div>
    </div>
    <div id="wrap">
      <canvas id="board" aria-label="Grainfall game board"></canvas>
      <div id="tut" hidden><span id="tutT"></span><button id="tutSkip" type="button">Skip</button></div>

      <div class="overlay" id="menu">
        <h1><canvas id="logo" role="img" aria-label="Grainfall"></canvas></h1>
        <div class="modes">
          <button class="mode" id="mLevels" type="button"><b>Levels</b><span id="mLevelsSub">Dig down to the gold</span></button>
          <button class="mode" id="mClassic" type="button"><b>Classic</b><span>Stack and clear. How long can you last?</span></button>
          <button class="mode" id="mDaily" type="button"><b>Daily board</b><span id="mDailySub">A new board every day</span></button>
          <button class="mode" id="mZen" type="button"><b>Zen</b><span>No clock, nothing rising. Just wood.</span></button>
        </div>
        <div class="row small">
          <button id="mWoods" type="button">Workshop</button>
          <button id="mStats" type="button">Scores</button>
          <button id="mSettings" type="button">Settings</button>
        </div>
      </div>

      <div class="overlay sub" id="levels" hidden>
        <h2>Levels</h2>
        <p id="levelsSub"></p>
        <div id="levelGrid"></div>
        <button class="back link" type="button">Back</button>
      </div>

      <div class="overlay sub" id="classic" hidden>
        <h2>Classic</h2>
        <p>Stack pieces and fill rows to clear them. Pieces speed up as you go. Chain clears for combos; four at once is a Tetris.</p>
        <div class="seg" id="diff" role="group" aria-label="Difficulty">
          <button type="button" data-v="easy">Easy</button>
          <button type="button" data-v="normal">Normal</button>
          <button type="button" data-v="hard">Hard</button>
        </div>
        <p id="diffNote"></p>
        <button id="go" type="button">Play</button>
        <button class="back link" type="button">Back</button>
      </div>

      <div class="overlay sub" id="woods" hidden>
        <h2>Workshop</h2>
        <p>Pick the wood your blocks are cut from.</p>
        <div id="woodGrid"></div>
        <button class="back link" type="button">Back</button>
      </div>

      <div class="overlay sub" id="stats" hidden>
        <h2>Scores</h2>
        <div id="hsList"></div>
        <h3 class="stathead">Stats</h3>
        <dl id="statList"></dl>
        <button class="back link" type="button">Back</button>
      </div>

      <div class="overlay sub" id="settings" hidden>
        <h2>Settings</h2>
        <div class="set">Drag speed
          <div class="seg" id="dragSeg"><button type="button" data-v="slow">Slow</button><button type="button" data-v="normal">Normal</button><button type="button" data-v="fast">Fast</button></div>
        </div>
        <div class="set">Vibration
          <div class="seg" id="hapSeg"><button type="button" data-v="on">On</button><button type="button" data-v="off">Off</button></div>
        </div>
        <div class="set">Music
          <div class="seg" id="musSeg"><button type="button" data-v="a">Tune A</button><button type="button" data-v="b">Tune B</button><button type="button" data-v="c">Rain</button><button type="button" data-v="off">Off</button></div>
        </div>
        <label class="set">Music volume <input type="range" id="musVol" min="0" max="100" step="5"></label>
        <label class="set">Effects volume <input type="range" id="sfxVol" min="0" max="100" step="5"></label>
        <div class="set">Sound
          <div class="seg" id="sndSeg"><button type="button" data-v="on">On</button><button type="button" data-v="off">Off</button></div>
        </div>
        <button id="tutAgain" class="small" type="button">Show the tutorial again</button>
        <button class="back link" type="button">Back</button>
      </div>

      <div class="overlay sub" id="over" hidden>
        <h2 id="overT"></h2>
        <div id="overStars" aria-hidden="true"></div>
        <div class="big" id="overS"></div>
        <p id="overB"></p>
        <p id="overU" class="unlock" hidden></p>
        <div class="row"><button id="overMain" type="button"></button><button id="overAlt" class="small" type="button"></button></div>
        <button id="overMenu" class="link" type="button">Menu</button>
      </div>

      <div class="overlay" id="paused" hidden>
        <h2>Paused</h2>
        <button id="resume" type="button">Resume</button>
        <div class="row small"><button id="restart" type="button">Restart</button><button id="pSettings" type="button">Settings</button><button id="quit" type="button">Menu</button></div>
      </div>
    </div>
  </div>
  <div id="bar">
    <button id="pauseBtn" class="ingame" type="button">Pause</button>
    <button id="holdBtn" class="ingame" type="button">Hold</button>
    <button id="dropBtn" class="ingame" type="button">Drop</button>
  </div>
</div>
<script src="wood.js"></script>
<script src="levels.js"></script>
<script src="music.js"></script>
<script src="game.js"></script>
</body>
</html>
